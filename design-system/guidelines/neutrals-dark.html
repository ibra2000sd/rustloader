<!-- @dsCard group="Colors" viewport="700x160" name="Dark neutrals & elevation" subtitle="OLED-friendly warm near-blacks in four steps + warm-white text" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; background: var(--bg-0); font-family: var(--font-mono); display: flex; align-items: center; justify-content: center; gap: 24px; height: 160px; color: var(--fg-2); }
.stack { display: flex; gap: 6px; }
.sw { width: 92px; height: 92px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); padding: 8px; box-sizing: border-box; font-size: 9px; color: var(--fg-3); }
.txt { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="stack">
  <div class="sw" style="background:var(--bg-0)">--bg-0<br>#0A0908<br>window</div>
  <div class="sw" style="background:var(--bg-1)">--bg-1<br>#121110<br>panel</div>
  <div class="sw" style="background:var(--bg-2)">--bg-2<br>#1A1815<br>card</div>
  <div class="sw" style="background:var(--bg-3)">--bg-3<br>#23201B<br>hover</div>
</div>
<div class="txt">
  <span style="color:var(--fg-1)">--fg-1 primary text</span>
  <span style="color:var(--fg-2)">--fg-2 secondary</span>
  <span style="color:var(--fg-3)">--fg-3 label</span>
  <span style="color:var(--fg-disabled)">--fg-disabled</span>
</div>
</body>
</html>
