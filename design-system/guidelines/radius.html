<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="Precise, not bubbly — 4 / 6 / 8 / 10 / 14" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; background: var(--bg-0); height: 150px; display: flex; align-items: center; justify-content: center; gap: 14px; }
.r { width: 88px; height: 88px; background: var(--bg-2); border: 1px solid var(--border-strong); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="r" style="border-radius:var(--radius-xs)">4 · bars, tags</div>
<div class="r" style="border-radius:var(--radius-sm)">6 · segments</div>
<div class="r" style="border-radius:var(--radius-md)">8 · buttons</div>
<div class="r" style="border-radius:var(--radius-lg)">10 · cards</div>
<div class="r" style="border-radius:var(--radius-xl)">14 · panels</div>
</body>
</html>
