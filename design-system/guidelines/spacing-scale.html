<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; background: var(--bg-0); height: 150px; display: flex; align-items: flex-end; justify-content: center; gap: 24px; padding-bottom: 34px; }
.s { display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
.s i { display: block; background: var(--rust-500); border-radius: 2px; width: 28px; }
</style>
</head>
<body>
<div class="s"><i style="height:4px"></i>4</div>
<div class="s"><i style="height:8px"></i>8</div>
<div class="s"><i style="height:12px"></i>12</div>
<div class="s"><i style="height:16px"></i>16</div>
<div class="s"><i style="height:20px"></i>20</div>
<div class="s"><i style="height:24px"></i>24</div>
<div class="s"><i style="height:32px"></i>32</div>
</body>
</html>
