<!-- @dsCard group="Colors" viewport="700x150" name="Accent — rust / copper ramp" subtitle="--rust-100…900; 500 is the primary accent" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; background: var(--bg-0); font-family: var(--font-mono); display: flex; align-items: center; justify-content: center; height: 150px; }
.row { display: flex; gap: 6px; }
.sw { width: 64px; height: 84px; border-radius: var(--radius-sm); display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; box-sizing: border-box; border: 1px solid var(--border-hairline); }
.sw span { font-size: 9px; color: rgba(255,255,255,0.75); }
.sw.dk span { color: rgba(255,255,255,0.85); }
.sw.lt span { color: rgba(0,0,0,0.6); }
.sw.p { outline: 2px solid var(--amber-400); outline-offset: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="sw lt" style="background:var(--rust-100)"><span>100</span></div>
  <div class="sw lt" style="background:var(--rust-200)"><span>200</span></div>
  <div class="sw lt" style="background:var(--rust-300)"><span>300</span></div>
  <div class="sw lt" style="background:var(--rust-400)"><span>400</span></div>
  <div class="sw dk p" style="background:var(--rust-500)"><span>500 · accent</span></div>
  <div class="sw dk" style="background:var(--rust-600)"><span>600</span></div>
  <div class="sw dk" style="background:var(--rust-700)"><span>700</span></div>
  <div class="sw dk" style="background:var(--rust-800)"><span>800</span></div>
  <div class="sw dk" style="background:var(--rust-900)"><span>900</span></div>
</div>
</body>
</html>
