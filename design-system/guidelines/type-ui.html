<!-- @dsCard group="Type" viewport="700x190" name="UI type — Geist" subtitle="View titles, section titles, body, labels" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; background: var(--bg-0); height: 190px; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 40px; font-family: var(--font-ui); }
.row { display: flex; align-items: baseline; gap: 20px; }
.tag { font-family: var(--font-mono); font-size: 9px; color: var(--fg-3); width: 150px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="row"><span class="tag">view title · 22/600</span><span style="font:var(--type-view-title);color:var(--fg-1);letter-spacing:var(--tracking-tight)">Downloads</span></div>
<div class="row"><span class="tag">section · 18/600</span><span style="font-size:var(--text-xl);font-weight:600;color:var(--fg-1)">Active queue</span></div>
<div class="row"><span class="tag">item title · 15/500</span><span style="font-size:var(--text-lg);font-weight:500;color:var(--fg-1)">interview-cut-final.mp4</span></div>
<div class="row"><span class="tag">body · 13/400</span><span style="font:var(--type-body);color:var(--fg-2)">Watch the clipboard while Rustloader is running.</span></div>
<div class="row"><span class="tag">label · 11/500</span><span style="font:var(--type-label);color:var(--fg-3)">Quality</span></div>
</body>
</html>
